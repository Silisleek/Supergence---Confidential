<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anatomical Multi-System Simulation // Exploded View</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #080b10;
        font-family:
          'Inter',
          -apple-system,
          sans-serif;
        color: #e2e8f0;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
      }
      #hud-overlay {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        pointer-events: none;
      }
      .hud-card {
        background: rgba(13, 17, 23, 0.88);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(0, 240, 255, 0.35);
        border-radius: 8px;
        padding: 14px 18px;
        pointer-events: auto;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }
      .hud-title {
        font-size: 13px;
        font-weight: 700;
        color: #00f0ff;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .hud-stats {
        font-size: 11px;
        color: #8b949e;
        margin-bottom: 12px;
      }
      .hud-control {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .hud-label {
        font-size: 11px;
        color: #cbd5e1;
        display: flex;
        justify-content: space-between;
      }
      input[type='range'] {
        width: 220px;
        accent-color: #00f0ff;
        cursor: pointer;
      }
      .btn-group {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .hud-btn {
        background: rgba(0, 240, 255, 0.1);
        border: 1px solid rgba(0, 240, 255, 0.4);
        color: #00f0ff;
        padding: 4px 10px;
        font-size: 10px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .hud-btn:hover {
        background: rgba(0, 240, 255, 0.25);
        color: #fff;
      }
      .layer-group {
        display: flex;
        gap: 4px;
        margin-top: 10px;
      }
      .layer-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #94a3b8;
        padding: 3px 7px;
        font-size: 9px;
        border-radius: 3px;
        cursor: pointer;
      }
      .layer-btn.active {
        background: rgba(0, 240, 255, 0.2);
        border-color: #00f0ff;
        color: #00f0ff;
      }
      #tooltip {
        position: absolute;
        display: none;
        z-index: 20;
        background: rgba(13, 17, 23, 0.95);
        border: 1px solid #00f0ff;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 11px;
        pointer-events: none;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      #tooltip .tt-name {
        font-weight: 700;
        color: #00f0ff;
      }
      #tooltip .tt-sys {
        color: #a78bfa;
        font-size: 10px;
        margin-top: 2px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="hud-overlay">
      <div class="hud-card">
        <div class="hud-title"><span>✦</span> Anatomical Core // Dynamic Simulation</div>
        <div class="hud-stats" id="piece-counter">Multi-System Active | 60 FPS</div>
        <div class="hud-control">
          <div class="hud-label">
            <span>EXPLODED VIEW (PULL APART)</span>
            <span id="slider-val">0%</span>
          </div>
          <input type="range" id="explode-slider" min="0" max="100" value="0" />
        </div>
        <div class="btn-group">
          <button class="hud-btn" id="btn-explode">Explode All</button>
          <button class="hud-btn" id="btn-assemble">Assemble</button>
          <button class="hud-btn" id="btn-orbit">Toggle Orbit</button>
        </div>
        <div class="layer-group">
          <button class="layer-btn active" data-sys="all">All</button>
          <button class="layer-btn active" data-sys="Skeletal">Skeletal</button>
          <button class="layer-btn active" data-sys="Organs">Organs</button>
          <button class="layer-btn active" data-sys="Circulatory">Vascular</button>
          <button class="layer-btn active" data-sys="Nervous">Nervous</button>
          <button class="layer-btn active" data-sys="Muscular">Muscular</button>
        </div>
      </div>
    </div>
    <div id="tooltip">
      <div class="tt-name" id="tt-title">Organ</div>
      <div class="tt-sys" id="tt-system">System</div>
    </div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x080b10);

      // Frame the 1.80m standing human figure centrally in viewport
      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.set(0, 0.95, 2.2);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0.95, 0);

      // Sleek Cybernetic Hologram Pedestal with dual concentric rings
      const grid = new THREE.GridHelper(3.0, 30, 0x00f0ff, 0x1e293b);
      grid.position.y = 0;
      scene.add(grid);

      const ringGeo1 = new THREE.RingGeometry(0.58, 0.6, 64);
      const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
      const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
      ring1.rotation.x = Math.PI / 2;
      ring1.position.y = 0.001;
      scene.add(ring1);

      const ringGeo2 = new THREE.RingGeometry(0.85, 0.86, 64);
      const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x7928ca, side: THREE.DoubleSide });
      const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
      ring2.rotation.x = Math.PI / 2;
      ring2.position.y = 0.001;
      scene.add(ring2);

      // Tactical Multi-Point Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);
      const keyLight = new THREE.DirectionalLight(0x00f0ff, 1.3);
      keyLight.position.set(3, 4, 3);
      scene.add(keyLight);
      const fillLight = new THREE.DirectionalLight(0xa78bfa, 0.9);
      fillLight.position.set(-3, 2, -2);
      scene.add(fillLight);
      const rimLight = new THREE.DirectionalLight(0xffffff, 0.8);
      rimLight.position.set(0, -3, -2);
      scene.add(rimLight);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Array holding all modular pieces
      const pieces = [];
      const bodyCenter = new THREE.Vector3(0, 1.25, 0);
      window.bodyCenter = bodyCenter;
      window.pieces = pieces;

      // ─── PART 1: AXIAL SKELETON (CRANIUM, SPINE & RIBCAGE) ───
      function buildAxialSkeleton(scene, pieces) {
        const mat = new THREE.MeshStandardMaterial({
          color: 0xeae6df,
          roughness: 0.35,
          metalness: 0.05,
        });

        function addPiece(mesh, name) {
          scene.add(mesh);
          pieces.push({
            mesh,
            originPos: mesh.position.clone(),
            explodeDir: new THREE.Vector3(
              mesh.position.x || 0.05,
              (mesh.position.y - 1.25) * 0.4,
              (mesh.position.z || 0.05) * 1.5,
            ).normalize(),
            name: name,
            system: 'Skeletal',
          });
        }

        const craniumGeo = new THREE.SphereGeometry(0.08, 24, 16);
        craniumGeo.scale(1.0, 1.1, 1.25);
        const cranium = new THREE.Mesh(craniumGeo, mat);
        cranium.position.set(0, 1.72, -0.01);
        addPiece(cranium, 'Cranium');

        const mandibleGeo = new THREE.TorusGeometry(0.04, 0.01, 8, 16);
        const mandible = new THREE.Mesh(mandibleGeo, mat);
        mandible.position.set(0, 1.6, 0.04);
        addPiece(mandible, 'Mandibula');

        const zygLGeo = new THREE.BoxGeometry(0.02, 0.02, 0.02);
        const zygL = new THREE.Mesh(zygLGeo, mat);
        zygL.position.set(-0.045, 1.66, 0.05);
        addPiece(zygL, 'Os Zygomaticum Sinistrum');

        const zygRGeo = new THREE.BoxGeometry(0.02, 0.02, 0.02);
        const zygR = new THREE.Mesh(zygRGeo, mat);
        zygR.position.set(0.045, 1.66, 0.05);
        addPiece(zygR, 'Os Zygomaticum Dextrum');

        const orbLGeo = new THREE.TorusGeometry(0.016, 0.003, 8, 16);
        const orbL = new THREE.Mesh(orbLGeo, mat);
        orbL.position.set(-0.032, 1.67, 0.06);
        addPiece(orbL, 'Orbita Sinistra');

        const orbRGeo = new THREE.TorusGeometry(0.016, 0.003, 8, 16);
        const orbR = new THREE.Mesh(orbRGeo, mat);
        orbR.position.set(0.032, 1.67, 0.06);
        addPiece(orbR, 'Orbita Dextra');

        for (let i = 0; i < 7; i++) {
          const geo = new THREE.CylinderGeometry(0.016, 0.016, 0.014);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(0, 1.51 + i * 0.016, 0.005 * Math.sin(i));
          addPiece(mesh, 'Vertebra Cervicalis C' + (i + 1));
        }

        for (let i = 0; i < 12; i++) {
          const geo = new THREE.CylinderGeometry(0.02, 0.02, 0.022);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(0, 1.22 + i * 0.024, -0.015 * Math.sin((i / 12) * Math.PI));
          addPiece(mesh, 'Vertebra Thoracica T' + (i + 1));
        }

        for (let i = 0; i < 5; i++) {
          const geo = new THREE.CylinderGeometry(0.025, 0.025, 0.035);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(0, 1.0 + i * 0.04, 0.01 * Math.sin((i / 5) * Math.PI));
          addPiece(mesh, 'Vertebra Lumbalis L' + (i + 1));
        }

        const sacrumGeo = new THREE.ConeGeometry(0.04, 0.1, 6);
        const sacrum = new THREE.Mesh(sacrumGeo, mat);
        sacrum.rotation.x = Math.PI;
        sacrum.position.set(0, 0.94, -0.02);
        addPiece(sacrum, 'Os Sacrum et Coccyx');

        const sternumGeo = new THREE.BoxGeometry(0.03, 0.2, 0.01);
        const sternum = new THREE.Mesh(sternumGeo, mat);
        sternum.position.set(0, 1.35, 0.11);
        addPiece(sternum, 'Sternum');

        for (let i = 0; i < 12; i++) {
          const ribGeoL = new THREE.TorusGeometry(0.12 + i * 0.005, 0.004, 8, 24, Math.PI);
          const ribL = new THREE.Mesh(ribGeoL, mat);
          ribL.position.set(0, 1.24 + i * 0.022, 0.03);
          ribL.rotation.set(Math.PI / 2, 0, Math.PI / 2);
          addPiece(ribL, 'Costa Sinistra ' + (i + 1));

          const ribGeoR = new THREE.TorusGeometry(0.12 + i * 0.005, 0.004, 8, 24, Math.PI);
          const ribR = new THREE.Mesh(ribGeoR, mat);
          ribR.position.set(0, 1.24 + i * 0.022, 0.03);
          ribR.rotation.set(Math.PI / 2, 0, -Math.PI / 2);
          addPiece(ribR, 'Costa Dextra ' + (i + 1));
        }
      }

      // ─── PART 2A: UPPER APPENDICULAR (SHOULDERS, ARMS & HANDS) ───
      function buildUpperLimbs(scene, pieces) {
        const mat = new THREE.MeshStandardMaterial({
          color: 0xeae6df,
          roughness: 0.35,
          metalness: 0.05,
        });
        const signs = [-1, 1];
        const sides = ['Sinistra', 'Dextra'];

        for (let s = 0; s < 2; s++) {
          const sign = signs[s];
          const side = sides[s];

          const clavicleGeo = new THREE.CylinderGeometry(0.006, 0.005, 0.16);
          const clavicle = new THREE.Mesh(clavicleGeo, mat);
          clavicle.position.set(sign * 0.1, 1.46, 0.06);
          clavicle.rotation.z = sign * 0.3;
          scene.add(clavicle);
          pieces.push({
            mesh: clavicle,
            originPos: clavicle.position.clone(),
            explodeDir: new THREE.Vector3(
              clavicle.position.x * 1.5,
              (clavicle.position.y - 1.2) * 0.3,
              clavicle.position.z,
            ).normalize(),
            name: 'Clavicula ' + side,
            system: 'Skeletal',
          });

          const scapulaGeo = new THREE.BoxGeometry(0.08, 0.1, 0.012);
          const scapula = new THREE.Mesh(scapulaGeo, mat);
          scapula.position.set(sign * 0.13, 1.38, -0.07);
          scene.add(scapula);
          pieces.push({
            mesh: scapula,
            originPos: scapula.position.clone(),
            explodeDir: new THREE.Vector3(
              scapula.position.x * 1.5,
              (scapula.position.y - 1.2) * 0.3,
              scapula.position.z,
            ).normalize(),
            name: 'Scapula ' + side,
            system: 'Skeletal',
          });

          const humerusGeo = new THREE.CylinderGeometry(0.016, 0.013, 0.27);
          const humerus = new THREE.Mesh(humerusGeo, mat);
          humerus.position.set(sign * 0.25, 1.28, 0.01);
          scene.add(humerus);
          pieces.push({
            mesh: humerus,
            originPos: humerus.position.clone(),
            explodeDir: new THREE.Vector3(
              humerus.position.x * 1.5,
              (humerus.position.y - 1.2) * 0.3,
              humerus.position.z,
            ).normalize(),
            name: 'Humerus ' + side,
            system: 'Skeletal',
          });

          const radiusGeo = new THREE.CylinderGeometry(0.008, 0.007, 0.27);
          const radius = new THREE.Mesh(radiusGeo, mat);
          radius.position.set(sign * 0.27 - sign * 0.012, 1.01, 0.03);
          scene.add(radius);
          pieces.push({
            mesh: radius,
            originPos: radius.position.clone(),
            explodeDir: new THREE.Vector3(
              radius.position.x * 1.5,
              (radius.position.y - 1.2) * 0.3,
              radius.position.z,
            ).normalize(),
            name: 'Radius ' + side,
            system: 'Skeletal',
          });

          const ulnaGeo = new THREE.CylinderGeometry(0.008, 0.007, 0.27);
          const ulna = new THREE.Mesh(ulnaGeo, mat);
          ulna.position.set(sign * 0.27 + sign * 0.012, 1.01, 0.03);
          scene.add(ulna);
          pieces.push({
            mesh: ulna,
            originPos: ulna.position.clone(),
            explodeDir: new THREE.Vector3(
              ulna.position.x * 1.5,
              (ulna.position.y - 1.2) * 0.3,
              ulna.position.z,
            ).normalize(),
            name: 'Ulna ' + side,
            system: 'Skeletal',
          });

          const palmGeo = new THREE.BoxGeometry(0.04, 0.06, 0.015);
          const palm = new THREE.Mesh(palmGeo, mat);
          palm.position.set(sign * 0.28, 0.83, 0.04);
          scene.add(palm);
          pieces.push({
            mesh: palm,
            originPos: palm.position.clone(),
            explodeDir: new THREE.Vector3(
              palm.position.x * 1.5,
              (palm.position.y - 1.2) * 0.3,
              palm.position.z,
            ).normalize(),
            name: 'Ossa Manus ' + side,
            system: 'Skeletal',
          });

          for (let f = 0; f < 5; f++) {
            const fingerGeo = new THREE.CylinderGeometry(0.003, 0.002, 0.06);
            const finger = new THREE.Mesh(fingerGeo, mat);
            finger.position.set(sign * (0.265 + f * 0.007), 0.76, 0.04);
            scene.add(finger);
            pieces.push({
              mesh: finger,
              originPos: finger.position.clone(),
              explodeDir: new THREE.Vector3(
                finger.position.x * 1.5,
                (finger.position.y - 1.2) * 0.3,
                finger.position.z,
              ).normalize(),
              name: 'Ossa Manus ' + side,
              system: 'Skeletal',
            });
          }
        }
      }

      // ─── PART 2B: LOWER APPENDICULAR (PELVIS, LEGS & FEET) ───
      function buildLowerLimbsAndPelvis(scene, pieces) {
        const mat = new THREE.MeshStandardMaterial({
          color: 0xeae6df,
          roughness: 0.35,
          metalness: 0.05,
        });

        function addMesh(geometry, x, y, z, rx, ry, rz, name) {
          const mesh = new THREE.Mesh(geometry, mat);
          mesh.position.set(x, y, z);
          if (rx) mesh.rotation.x = rx;
          if (ry) mesh.rotation.y = ry;
          if (rz) mesh.rotation.z = rz;
          scene.add(mesh);
          pieces.push({
            mesh,
            originPos: mesh.position.clone(),
            explodeDir: new THREE.Vector3(
              mesh.position.x * 1.5,
              (mesh.position.y - 0.7) * 0.3,
              mesh.position.z,
            ).normalize(),
            name: name,
            system: 'Skeletal',
          });
        }

        addMesh(
          new THREE.BoxGeometry(0.02, 0.08, 0.12),
          -0.14,
          0.96,
          0.0,
          0,
          -0.3,
          0,
          'Crista Iliaca Sinistra (Pelvis)',
        );
        addMesh(
          new THREE.BoxGeometry(0.02, 0.08, 0.12),
          0.14,
          0.96,
          0.0,
          0,
          0.3,
          0,
          'Crista Iliaca Dextra (Pelvis)',
        );
        addMesh(
          new THREE.TorusGeometry(0.05, 0.012, 8, 16, Math.PI),
          0,
          0.88,
          0.05,
          Math.PI / 2,
          0,
          0,
          'Arcus Pubicus (Pelvis)',
        );
        addMesh(
          new THREE.BoxGeometry(0.03, 0.03, 0.04),
          -0.07,
          0.84,
          -0.03,
          0,
          0,
          0,
          'Ischium Sinistrum (Pelvis)',
        );
        addMesh(
          new THREE.BoxGeometry(0.03, 0.03, 0.04),
          0.07,
          0.84,
          -0.03,
          0,
          0,
          0,
          'Ischium Dextrum (Pelvis)',
        );

        for (let s = 0; s < 2; s++) {
          const sign = s === 0 ? -1 : 1;
          const side = sign === -1 ? 'Sinistrum' : 'Dextrum';

          addMesh(
            new THREE.CylinderGeometry(0.022, 0.017, 0.4),
            sign * 0.11,
            0.68,
            0.01,
            0,
            0,
            0,
            'Os Femoris ' + side,
          );
          addMesh(
            new THREE.SphereGeometry(0.022, 16, 16),
            sign * 0.12,
            0.88,
            0.01,
            0,
            0,
            0,
            'Caput Femoris ' + side,
          );
          addMesh(
            new THREE.CylinderGeometry(0.02, 0.02, 0.01, 16),
            sign * 0.11,
            0.48,
            0.035,
            Math.PI / 2,
            0,
            0,
            'Patella ' + side,
          );
          addMesh(
            new THREE.CylinderGeometry(0.019, 0.014, 0.4),
            sign * 0.11,
            0.28,
            0.01,
            0,
            0,
            0,
            'Tibia ' + side,
          );
          addMesh(
            new THREE.CylinderGeometry(0.007, 0.006, 0.4),
            sign * 0.135,
            0.28,
            0.0,
            0,
            0,
            0,
            'Fibula ' + side,
          );
          addMesh(
            new THREE.BoxGeometry(0.035, 0.04, 0.06),
            sign * 0.11,
            0.03,
            -0.03,
            0,
            0,
            0,
            'Calcaneus ' + side,
          );
          addMesh(
            new THREE.BoxGeometry(0.045, 0.025, 0.12),
            sign * 0.11,
            0.015,
            0.04,
            0,
            0,
            0,
            'Ossa Pedis ' + side,
          );

          for (let t = 0; t < 5; t++) {
            addMesh(
              new THREE.SphereGeometry(0.006, 8, 8),
              sign * (0.095 + t * 0.008),
              0.008,
              0.11,
              0,
              0,
              0,
              'Ossa Pedis Digitus ' + (t + 1) + ' ' + side,
            );
          }
        }
      }

      // ─── PART 3: VISCERAL ORGAN SYSTEM ───
      function buildOrganSystem(scene, pieces) {
        var matLeftCerebrum = new THREE.MeshStandardMaterial({ color: 0xe2a3a8 });
        var geoLeftCerebrum = new THREE.SphereGeometry(0.05, 16, 12);
        var meshLeftCerebrum = new THREE.Mesh(geoLeftCerebrum, matLeftCerebrum);
        meshLeftCerebrum.scale.set(0.8, 1.0, 1.2);
        meshLeftCerebrum.position.set(-0.03, 1.72, 0.0);
        scene.add(meshLeftCerebrum);
        pieces.push({
          mesh: meshLeftCerebrum,
          originPos: meshLeftCerebrum.position.clone(),
          explodeDir: new THREE.Vector3(
            meshLeftCerebrum.position.x || 0.05,
            (meshLeftCerebrum.position.y - 1.25) * 0.5,
            (meshLeftCerebrum.position.z || 0.05) + 0.5,
          ).normalize(),
          name: 'Encephalon',
          system: 'Organs',
        });

        var matRightCerebrum = new THREE.MeshStandardMaterial({ color: 0xe2a3a8 });
        var geoRightCerebrum = new THREE.SphereGeometry(0.05, 16, 12);
        var meshRightCerebrum = new THREE.Mesh(geoRightCerebrum, matRightCerebrum);
        meshRightCerebrum.scale.set(0.8, 1.0, 1.2);
        meshRightCerebrum.position.set(0.03, 1.72, 0.0);
        scene.add(meshRightCerebrum);
        pieces.push({
          mesh: meshRightCerebrum,
          originPos: meshRightCerebrum.position.clone(),
          explodeDir: new THREE.Vector3(

      // ─── PART 5: INTERACTION & EXPLODED CONTROLLER ───
      function initExplosionController(scene, camera, renderer, controls, pieces) {
        const slider = document.getElementById('explode-slider');
        const sliderVal = document.getElementById('slider-val');
        const btnExplode = document.getElementById('btn-explode');
        const btnAssemble = document.getElementById('btn-assemble');
        const btnOrbit = document.getElementById('btn-orbit');
        const tooltip = document.getElementById('tooltip');
        const ttTitle = document.getElementById('tt-title');
        const ttSystem = document.getElementById('tt-system');

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const meshes = pieces.map((p) => p.mesh);
        let hoveredPiece = null;
        let originalEmissive = null;
        let animationId = null;
        let targetSliderValue = parseFloat(slider.value) || 0;
        let isAnimating = false;

        function updatePieces(value) {
          pieces.forEach((piece) => {
            piece.mesh.position
              .copy(piece.originPos)
              .addScaledVector(piece.explodeDir, (value / 100) * 0.45);
          });
          sliderVal.textContent = `${Math.round(value)}%`;
        }

        slider.addEventListener('input', () => {
          const val = parseFloat(slider.value);
          targetSliderValue = val;
          updatePieces(val);
        });

        function animateSlider(target) {
          targetSliderValue = target;
          if (!isAnimating) {
            isAnimating = true;
            function step() {
              const current = parseFloat(slider.value);
              const diff = targetSliderValue - current;
              if (Math.abs(diff) < 0.5) {
                slider.value = targetSliderValue;
                updatePieces(targetSliderValue);
                isAnimating = false;
                return;
              }
              const next = current + diff * 0.08;
              slider.value = next;
              updatePieces(next);
              requestAnimationFrame(step);
            }
            step();
          }
        }

        btnExplode.addEventListener('click', () => animateSlider(100));
        btnAssemble.addEventListener('click', () => animateSlider(0));
        btnOrbit.addEventListener('click', () => {
          controls.autoRotate = !controls.autoRotate;
        });

        renderer.domElement.addEventListener('pointermove', (event) => {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(pointer, camera);
          const intersects = raycaster.intersectObjects(meshes, false);

          if (hoveredPiece && hoveredPiece.mesh.material) {
            hoveredPiece.mesh.material.emissive.copy(originalEmissive);
            hoveredPiece = null;
            originalEmissive = null;
          }

          if (intersects.length > 0) {
            const hitMesh = intersects[0].object;
            const piece = pieces.find((p) => p.mesh === hitMesh);
            if (piece) {
              hoveredPiece = piece;
              if (piece.mesh.material && piece.mesh.material.emissive) {
                originalEmissive = piece.mesh.material.emissive.clone();
                piece.mesh.material.emissive.setHex(0x333333);
              }
              tooltip.style.display = 'block';
              tooltip.style.left = event.clientX + 15 + 'px';
              tooltip.style.top = event.clientY + 15 + 'px';
              ttTitle.textContent = piece.name;
              ttSystem.textContent = piece.system;
            }
          } else {
            tooltip.style.display = 'none';
          }
        });

        renderer.domElement.addEventListener('pointerleave', () => {
          if (hoveredPiece && hoveredPiece.mesh.material && originalEmissive) {
            hoveredPiece.mesh.material.emissive.copy(originalEmissive);
            hoveredPiece = null;
            originalEmissive = null;
          }
          tooltip.style.display = 'none';
        });

        function renderLoop() {
          animationId = requestAnimationFrame(renderLoop);
          controls.update();
          renderer.render(scene, camera);
        }

        updatePieces(parseFloat(slider.value) || 0);
        renderLoop();
      }

          }
        }

        // Harmonize piece structures for controller
        for (let i = 0; i < pieces.length; i++) {
          const p = pieces[i];
          const m = p.mesh || p;
          m.userData = m.userData || {};
          m.userData.originPos = m.userData.originPos || p.originPos || m.position.clone();
          m.userData.explodeDir =
            m.userData.explodeDir ||
            p.explodeDir ||
            new THREE.Vector3(
              m.position.x || 0.1,
              (m.position.y || 1.2) - 1.25,
              m.position.z || 0,
            ).normalize();
          m.userData.name = m.userData.name || p.name || 'Component';
          m.userData.system = m.userData.system || p.system || 'Anatomical';
          p.position = m.position;
          p.userData = m.userData;
        }

        if (typeof initExplosionController === 'function') {
          try {

        // Multi-System Layer Filter Buttons Handler

          btn.addEventListener('click', () => {
            const sys = btn.dataset.sys;

              const makeActive = !btn.classList.contains('active');
              document
                .querySelectorAll('.layer-btn')
                .forEach((b) => b.classList.toggle('active', makeActive));
              pieces.forEach((p) => {
                (p.mesh || p).visible = makeActive;
              });
              return;
            }
            btn.classList.toggle('active');
            const isActive = btn.classList.contains('active');
            pieces.forEach((p) => {
              const m = p.mesh || p;
              const psys = (m.userData?.system || p.system || '').toLowerCase();
              if (
                psys.includes(sys.toLowerCase()) ||
                (sys === 'Circulatory' && psys.includes('vascular'))
              ) {
                m.visible = isActive;
              }
            });
          });
        });

        // Guarantee smooth render loop with cyber ring rotation
        function fallbackAnimate() {
          requestAnimationFrame(fallbackAnimate);
          if (ring1) ring1.rotation.z += 0.004;
          if (ring2) ring2.rotation.z -= 0.002;
          controls.update();
          renderer.render(scene, camera);
        }
        fallbackAnimate();

        const counterEl = document.getElementById('piece-counter');
        if (counterEl) {
          counterEl.textContent = `Pieces: ${pieces.length} | Multi-System Active | 60 FPS`;
        }
      } catch (execErr) {
        console.error('Error during parts initialization:', execErr);
